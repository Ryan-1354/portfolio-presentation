<svg viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK TC, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#EDEAE2"/><line x1="0" y1="0" x2="0" y2="9" stroke="#C9C2B4" stroke-width="4.5"/></pattern></defs><rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/><text x="48" y="44" font-size="18" font-weight="700" letter-spacing="1" fill="#8A7654">STEP 1 &#183; 上傳行程檔案</text><text x="616" y="44" font-size="18" font-weight="700" letter-spacing="1" fill="#8A7654">STEP 2 &#183; 資訊核對與人工修正</text><rect x="48" y="66" width="440" height="460" rx="3" fill="#F7F5F0" stroke="#C9C2B4" stroke-width="1"/><rect x="72" y="90" width="110" height="20" rx="2" fill="#EDEAE2"/><circle cx="448" cy="100" r="10" fill="#EDEAE2"/><rect x="72" y="132" width="392" height="300" rx="3" fill="#FFFFFF" stroke="#8A7654" stroke-width="1.4"/><text x="94" y="172" font-size="16" font-weight="700" fill="#1F1E1D">上傳行程檔案</text><text x="94" y="194" font-size="12" fill="#8B877F">AI 將辨識上傳內容，並於下一步提供資訊供您核對</text><rect x="94" y="214" width="348" height="54" rx="2" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1" stroke-dasharray="4 3"/><text x="112" y="247" font-size="13" fill="#4A453D">點擊上傳</text><text x="408" y="249" font-size="16" fill="#8B877F">+</text><circle cx="98" cy="290" r="2" fill="#8A7654"/><text x="108" y="294" font-size="11.5" fill="#8B877F">僅限上傳 1 份主要行程檔案，最大 20MB</text><circle cx="98" cy="312" r="2" fill="#8A7654"/><text x="108" y="316" font-size="11.5" fill="#8B877F">支援格式：PDF、JPG、PNG</text><circle cx="98" cy="334" r="2" fill="#8A7654"/><text x="108" y="338" font-size="11.5" fill="#8B877F">下一步可上傳附加資料及編輯主圖</text><rect x="354" y="378" width="88" height="32" rx="2" fill="#8A7654"/><text x="398.0" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">下一步</text><text x="528" y="290.0" font-size="12" fill="#8B877F">AI 解析</text><line x1="504" y1="304.0" x2="584" y2="304.0" stroke="#8B877F" stroke-width="1"/><path d="M 578 299.0 l6 5 -6 5" fill="none" stroke="#8B877F" stroke-width="1.2"/><rect x="616" y="66" width="576" height="682" rx="3" fill="#F7F5F0" stroke="#C9C2B4" stroke-width="1"/><rect x="640" y="88" width="528" height="34" rx="0" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><rect x="649" y="94" width="22" height="22" rx="4" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><path d="M 660 99 L 666 105 L 660 111 L 654 105 Z" fill="#8A7654"/><rect x="1032" y="96" width="72" height="18" rx="9" fill="#EDEAE2"/><text x="1068" y="109" text-anchor="middle" font-size="10" fill="#4A453D">升級方案</text><circle cx="1136" cy="105" r="12" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><rect x="640" y="142" width="528" height="90" rx="3" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><rect x="656" y="158" width="58" height="58" rx="2" fill="url(#hatch)" stroke="#C9C2B4" stroke-width="1"/><text x="728" y="180" font-size="15" font-weight="700" fill="#1F1E1D">－ 行程名稱 －</text><rect x="640" y="270" width="330" height="382" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><line x1="640" y1="270" x2="970" y2="652" stroke="#C9C2B4" stroke-width="1"/><line x1="970" y1="270" x2="640" y2="652" stroke="#C9C2B4" stroke-width="1"/><text x="728" y="200" font-size="11.5" fill="#8B877F">－ 行程特色摘要（地點、亮點列表）－</text><text x="640" y="254" font-size="12.5" font-weight="700" fill="#1F1E1D">行程檔案</text><text x="706" y="254" font-size="11.5" fill="#8B877F">這是您上傳的檔案，請核對右側資訊是否正確</text><text x="988" y="254" font-size="14" font-weight="700" fill="#1F1E1D">行程資訊</text><text x="988" y="280" font-size="11.5" fill="#8B877F">行程名稱 *</text><rect x="988" y="288" width="180" height="30" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="988" y="334" font-size="11.5" fill="#8B877F">行程特色</text><rect x="988" y="342" width="180" height="30" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="988" y="388" font-size="11.5" fill="#8B877F">出發地</text><rect x="988" y="396" width="180" height="30" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="988" y="442" font-size="11.5" fill="#8B877F">上架日期 * ／下架日期 *</text><rect x="988" y="450" width="85.0" height="28" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="1000" y="469" font-size="11" fill="#8B877F">－ 待填 －</text><rect x="1083.0" y="450" width="85.0" height="28" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="1095.0" y="469" font-size="11" fill="#8B877F">－ 待填 －</text><text x="988" y="496" font-size="11.5" fill="#8B877F">出發日期（可複選）</text><rect x="988" y="504" width="90" height="26" rx="13" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="1004" y="521" font-size="10.5" fill="#4A453D">－ 日期 － &#215;</text><circle cx="1100" cy="517" r="12" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="1100" y="521" text-anchor="middle" font-size="13" fill="#8B877F">+</text><text x="988" y="544" font-size="10.5" fill="#8B877F">出發日期須介於上架與下架日期之間</text><text x="988" y="570" font-size="11.5" fill="#8B877F">同業售價 *</text><rect x="988" y="578" width="140" height="28" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="998" y="597" font-size="10" fill="#8B877F">NT$－金額－</text><text x="1136" y="597" font-size="10.5" fill="#8B877F">起</text><text x="988" y="624" font-size="11.5" fill="#8B877F">附加資料</text><rect x="988" y="632" width="120" height="26" rx="13" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="1000" y="649" font-size="10" fill="#4A453D">－附件檔名－ &#215;</text><circle cx="1130" cy="645" r="12" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="1130" y="649" text-anchor="middle" font-size="13" fill="#8B877F">+</text><rect x="640" y="692" width="76" height="32" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="678.0" y="713" text-anchor="middle" font-size="12" fill="#4A453D">取消</text><rect x="726" y="692" width="76" height="32" rx="2" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="764.0" y="713" text-anchor="middle" font-size="12" fill="#4A453D">儲存</text><rect x="1058" y="692" width="110" height="32" rx="2" fill="#8A7654"/><text x="1113.0" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">確定發佈</text></svg>