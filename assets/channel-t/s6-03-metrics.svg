<svg viewBox="0 0 1024 486" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK TC, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="0" y="0" width="1024" height="486" fill="#FFFFFF"/><rect x="0" y="0" width="1024" height="40" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="26" font-size="14" font-weight="700" fill="#1F1E1D">關鍵指標</text><text x="276" y="26" font-size="14" font-weight="700" fill="#1F1E1D">指標目標</text><text x="536" y="26" font-size="14" font-weight="700" fill="#1F1E1D">備註</text><rect x="0" y="40" width="1024" height="30" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="60" font-size="12" font-weight="700" fill="#8A7654">公司商業指標</text><rect x="0" y="70" width="1024" height="36" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="92.5" font-size="12" fill="#4A453D">月付費會員轉換率</text><text x="276" y="92.5" font-size="12.5" font-weight="700" fill="#1F1E1D">5%</text><rect x="0" y="106" width="1024" height="30" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="126" font-size="12" font-weight="700" fill="#8A7654">產品成功指標</text><rect x="0" y="136" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="160.5" font-size="12" fill="#4A453D">月活躍旅行社比例</text><text x="276" y="160.5" font-size="12.5" font-weight="700" fill="#1F1E1D">20%</text><text x="536" y="160.5" font-size="11" fill="#8B877F">有上架行程的旅行社數／總旅行社數量</text><rect x="0" y="176" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="200.5" font-size="12" fill="#4A453D">月上架行程總數</text><text x="276" y="200.5" font-size="12.5" font-weight="700" fill="#1F1E1D">630 個/月</text><text x="536" y="200.5" font-size="11" fill="#8B877F">反映平台行程供應量的成長趨勢</text><rect x="0" y="216" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="240.5" font-size="12" fill="#4A453D">月每行程平均詢問數</text><text x="276" y="240.5" font-size="12.5" font-weight="700" fill="#1F1E1D">1～3 次</text><text x="536" y="240.5" font-size="11" fill="#8B877F">反映行程吸引力與旅行社間互動情況</text><rect x="0" y="256" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="280.5" font-size="12" fill="#4A453D">月行程被收藏比例</text><text x="276" y="280.5" font-size="12.5" font-weight="700" fill="#1F1E1D">15%</text><text x="536" y="280.5" font-size="11" fill="#8B877F">衡量供給與需求是否平衡</text><rect x="0" y="296" width="1024" height="30" fill="#EDEAE2" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="316" font-size="12" font-weight="700" fill="#8A7654">觸點階段指標</text><rect x="0" y="326" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="350.5" font-size="12" fill="#4A453D">月產品首頁跳出率</text><text x="276" y="350.5" font-size="12.5" font-weight="700" fill="#1F1E1D">30%</text><text x="536" y="350.5" font-size="11" fill="#8B877F">跳出率指進入頁面未互動即離開的比例</text><rect x="0" y="366" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="390.5" font-size="12" fill="#4A453D">方案升級按鍵點擊率</text><text x="276" y="390.5" font-size="12.5" font-weight="700" fill="#1F1E1D">10%</text><text x="536" y="390.5" font-size="11" fill="#8B877F">線控＆合作夥伴</text><rect x="0" y="406" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="430.5" font-size="12" fill="#4A453D">上架行程按鈕點擊率</text><text x="276" y="430.5" font-size="12.5" font-weight="700" fill="#1F1E1D">25%</text><text x="536" y="430.5" font-size="11" fill="#8B877F">評估供給端核心工作活躍程度</text><rect x="0" y="446" width="1024" height="40" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="1"/><text x="16" y="470.5" font-size="12" fill="#4A453D">AI推薦行程按鈕點擊率</text><text x="276" y="470.5" font-size="12.5" font-weight="700" fill="#1F1E1D">20%</text><text x="536" y="470.5" font-size="11" fill="#8B877F">評估需求端核心工作活躍程度</text></svg>