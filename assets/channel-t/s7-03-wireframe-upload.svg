<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK TC">
  <rect width="1200" height="640" fill="#FFFFFF"/>

  <!-- Left: Modal (upload step) -->
  <g>
    <text x="60" y="66" font-size="14" fill="#8A7638" font-weight="600">STEP 1 · 上傳原始檔案</text>

    <rect x="60" y="86" width="420" height="300" rx="6" fill="#F2EEE6" stroke="#D6D2C8"/>
    <!-- close icon -->
    <circle cx="450" cy="116" r="10" fill="none" stroke="#6E6A62"/>
    <line x1="446" y1="112" x2="454" y2="120" stroke="#6E6A62" stroke-width="1.2"/>
    <line x1="454" y1="112" x2="446" y2="120" stroke="#6E6A62" stroke-width="1.2"/>

    <text x="270" y="130" font-size="17" fill="#1C1B1A" text-anchor="middle" font-weight="700">行程檔案上傳</text>

    <rect x="90" y="160" width="360" height="1" fill="#D6D2C8"/>

    <text x="90" y="190" font-size="12" fill="#6E6A62">支援 PDF／圖片格式，單檔上限 20MB</text>

    <text x="90" y="222" font-size="13" fill="#454340">檔案</text>
    <rect x="90" y="232" width="360" height="46" rx="4" fill="#FFFFFF" stroke="#D6D2C8" stroke-dasharray="4 3"/>
    <text x="270" y="260" font-size="13" fill="#6E6A62" text-anchor="middle">拖曳或點擊上傳行程檔案</text>

    <rect x="330" y="342" width="120" height="34" rx="4" fill="#8A7638"/>
    <text x="390" y="364" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">確認上傳</text>
  </g>

  <!-- Arrow -->
  <line x1="500" y1="240" x2="560" y2="240" stroke="#D6D2C8" stroke-width="1.5"/>
  <polygon points="566,240 556,234 556,246" fill="#D6D2C8"/>
  <text x="533" y="228" font-size="11" fill="#6E6A62" text-anchor="middle">AI 解析</text>

  <!-- Right: Review page -->
  <g>
    <text x="600" y="66" font-size="14" fill="#8A7638" font-weight="600">STEP 2 · 資訊核對與人工修正</text>

    <rect x="600" y="86" width="540" height="420" rx="6" fill="#F2EEE6" stroke="#D6D2C8"/>

    <!-- header bar -->
    <rect x="600" y="86" width="540" height="46" rx="6" fill="#E8E3D9"/>
    <circle cx="626" cy="109" r="8" fill="#D6D2C8"/>
    <circle cx="1104" cy="109" r="9" fill="#D6D2C8"/>

    <!-- image placeholder -->
    <rect x="624" y="150" width="220" height="150" rx="4" fill="#FFFFFF" stroke="#D6D2C8"/>
    <line x1="624" y1="150" x2="844" y2="300" stroke="#D6D2C8"/>
    <line x1="844" y1="150" x2="624" y2="300" stroke="#D6D2C8"/>

    <!-- field panel -->
    <text x="864" y="168" font-size="12" fill="#6E6A62">行程名稱</text>
    <rect x="864" y="176" width="256" height="34" rx="4" fill="#FFFFFF" stroke="#D6D2C8"/>
    <text x="876" y="198" font-size="12" fill="#1C1B1A">— 待填入 —</text>

    <text x="864" y="228" font-size="12" fill="#6E6A62">出發日期（可複選）</text>
    <rect x="864" y="236" width="118" height="30" rx="14" fill="#E8E3D9" stroke="#D6D2C8"/>
    <text x="923" y="255" font-size="11" fill="#1C1B1A" text-anchor="middle">2026-01-01</text>
    <rect x="990" y="236" width="130" height="30" rx="14" fill="#E8E3D9" stroke="#D6D2C8"/>
    <text x="1008" y="255" font-size="14" fill="#6E6A62">＋</text>

    <text x="864" y="288" font-size="12" fill="#6E6A62">上架 ／ 下架日期</text>
    <rect x="864" y="296" width="122" height="30" rx="4" fill="#FFFFFF" stroke="#D6D2C8"/>
    <text x="925" y="315" font-size="11" fill="#1C1B1A" text-anchor="middle">2025-12-12</text>
    <rect x="998" y="296" width="122" height="30" rx="4" fill="#FFFFFF" stroke="#D6D2C8"/>
    <text x="1059" y="315" font-size="11" fill="#1C1B1A" text-anchor="middle">2026-06-06</text>

    <text x="864" y="348" font-size="12" fill="#6E6A62">同業售價</text>
    <rect x="864" y="356" width="256" height="34" rx="4" fill="#FFFFFF" stroke="#D6D2C8"/>
    <text x="876" y="378" font-size="12" fill="#1C1B1A">— 金額 —</text>
    <text x="1104" y="378" font-size="12" fill="#6E6A62">起</text>

    <rect x="624" y="316" width="220" height="1" fill="#D6D2C8"/>
    <text x="624" y="340" font-size="11" fill="#6E6A62">主圖與行程摘要區塊</text>

    <!-- bottom actions -->
    <rect x="864" y="440" width="110" height="34" rx="4" fill="none" stroke="#D6D2C8"/>
    <text x="919" y="462" font-size="12" fill="#454340" text-anchor="middle">返回上一頁</text>

    <rect x="988" y="440" width="132" height="34" rx="4" fill="#8A7638"/>
    <text x="1054" y="462" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">確定上架</text>
  </g>

</svg>
