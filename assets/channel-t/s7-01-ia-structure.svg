<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter Tight, Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="1000" height="720" fill="#FFFFFF"/>

  <!-- file label -->

  <!-- ===== Layer 0: Global Header/Navigation ===== -->
  <text x="60" y="70" font-size="15" fill="#8A7638" font-weight="600">全域共用層｜Header / Navigation</text>

  <g>
    <!-- 6 chips -->
    <rect x="60" y="86" width="140" height="52" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
    <text x="130" y="108" font-size="14" fill="#1C1B1A" text-anchor="middle">會員與帳號</text>
    <text x="130" y="126" font-size="11" fill="#6E6A62" text-anchor="middle">身份與方案入口</text>

    <rect x="212" y="86" width="140" height="52" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
    <text x="282" y="108" font-size="14" fill="#1C1B1A" text-anchor="middle">AI 智能推薦</text>
    <text x="282" y="126" font-size="11" fill="#6E6A62" text-anchor="middle">核心搜尋功能</text>

    <rect x="364" y="86" width="140" height="52" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
    <text x="434" y="108" font-size="14" fill="#1C1B1A" text-anchor="middle">系統通知</text>
    <text x="434" y="126" font-size="11" fill="#6E6A62" text-anchor="middle">分銷與曝光資訊</text>

    <rect x="516" y="86" width="140" height="52" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
    <text x="586" y="108" font-size="14" fill="#1C1B1A" text-anchor="middle">即時訊息</text>
    <text x="586" y="126" font-size="11" fill="#6E6A62" text-anchor="middle">供需分銷溝通</text>

    <rect x="668" y="86" width="140" height="52" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
    <text x="738" y="108" font-size="14" fill="#1C1B1A" text-anchor="middle">會員功能選單</text>
    <text x="738" y="126" font-size="11" fill="#6E6A62" text-anchor="middle">承載第二層功能</text>

    <rect x="820" y="86" width="120" height="52" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
    <text x="880" y="108" font-size="14" fill="#1C1B1A" text-anchor="middle">導覽搜尋</text>
    <text x="880" y="126" font-size="11" fill="#6E6A62" text-anchor="middle">全域地理導覽</text>
  </g>

  <!-- connector line -->
  <line x1="500" y1="150" x2="500" y2="190" stroke="#D6D2C8" stroke-width="1.5"/>
  <polygon points="500,196 494,186 506,186" fill="#D6D2C8"/>

  <!-- ===== Layer 1: 首頁 ===== -->
  <rect x="40" y="206" width="920" height="150" rx="4" fill="none" stroke="#D6D2C8" stroke-dasharray="4 4"/>
  <text x="60" y="234" font-size="15" fill="#8A7638" font-weight="600">第一層｜首頁 — 兩種行程搜尋方式</text>

  <rect x="200" y="252" width="280" height="86" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
  <text x="340" y="278" font-size="16" fill="#1C1B1A" text-anchor="middle" font-weight="600">導覽搜尋</text>
  <text x="340" y="300" font-size="12" fill="#6E6A62" text-anchor="middle">符合既有找團習慣</text>
  <text x="340" y="318" font-size="12" fill="#6E6A62" text-anchor="middle">洲別／國家／城市逐步探索</text>

  <rect x="520" y="252" width="280" height="86" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
  <text x="660" y="278" font-size="16" fill="#1C1B1A" text-anchor="middle" font-weight="600">關鍵字搜尋</text>
  <text x="660" y="300" font-size="12" fill="#6E6A62" text-anchor="middle">目的明確的快速查找</text>
  <text x="660" y="318" font-size="12" fill="#6E6A62" text-anchor="middle">低學習成本入口</text>

  <text x="500" y="384" font-size="12" fill="#6E6A62" text-anchor="middle">導覽搜尋處於較高資訊層級，關鍵字搜尋保留於首頁作為熟悉入口</text>

  <!-- connector -->
  <line x1="500" y1="400" x2="500" y2="440" stroke="#D6D2C8" stroke-width="1.5"/>
  <polygon points="500,446 494,436 506,436" fill="#D6D2C8"/>

  <!-- ===== Layer 2: 會員功能選單 ===== -->
  <rect x="40" y="456" width="920" height="130" rx="4" fill="none" stroke="#D6D2C8" stroke-dasharray="4 4"/>
  <text x="60" y="484" font-size="15" fill="#8A7638" font-weight="600">第二層｜會員功能選單 — 供給端核心工作流程</text>

  <rect x="260" y="502" width="220" height="64" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
  <text x="370" y="530" font-size="15" fill="#1C1B1A" text-anchor="middle" font-weight="600">行程上架</text>
  <text x="370" y="550" font-size="12" fill="#6E6A62" text-anchor="middle">建立新的旅遊行程</text>

  <rect x="520" y="502" width="220" height="64" rx="4" fill="#F2EEE6" stroke="#D6D2C8"/>
  <text x="630" y="530" font-size="15" fill="#1C1B1A" text-anchor="middle" font-weight="600">行程管理</text>
  <text x="630" y="550" font-size="12" fill="#6E6A62" text-anchor="middle">管理既有行程</text>

  <!-- CTA tradeoff note -->
  <rect x="60" y="612" width="880" height="76" rx="4" fill="#F2EEE6" stroke="#8A7638" stroke-width="1"/>
  <text x="86" y="638" font-size="13" fill="#8A7638" font-weight="600">CTA 層級取捨｜方案升級 vs. 上架行程</text>
  <text x="86" y="660" font-size="12" fill="#454340">上架行程是供給端核心任務，但當期商業策略以會員轉換為優先目標，</text>
  <text x="86" y="678" font-size="12" fill="#454340">因此方案升級置於全域層級作為 CTA，上架行程收入會員功能選單。</text>

  <!-- (no reproduction disclaimer needed — this is an original diagram illustrating written methodology, not a recreation of a real screen) -->
</svg>
